name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: path normalization bugs hide there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # depwave needs history to find the merge base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:deps
      - run: pnpm build
      - name: pnpm test
        id: test
        # JSON results feed depwave's shadow check below. `pnpm exec`, not `pnpm test --reporter=…`: pnpm parses
        # `--reporter` as its own option and rejects `--outputFile.json` before vitest ever starts.
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=test-results.json

      # Dogfooding: the built CLI must analyze this very change. A crash, an unresolved import, or a git edge case
      # here is a regression no unit test caught. Make this job a required check in branch protection.
      - name: Restore depwave cache
        uses: actions/cache@v4
        with:
          path: .depwave
          key: depwave-${{ runner.os }}-${{ github.sha }}
          restore-keys: depwave-${{ runner.os }}-
      - name: depwave impact (self-host)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}"; else BASE="HEAD~1"; fi
          node packages/cli/dist/bin.js impact --base "$BASE" --head HEAD
          node packages/cli/dist/bin.js impact --base "$BASE" --head HEAD --format json > depwave-impact.json
          node -e "const r=require('./depwave-impact.json').report; if (r.unresolved.length) { console.error('unresolved imports:', r.unresolved); process.exit(1); }"
          node packages/cli/dist/bin.js cache stats

      # Shadow mode: every test ran above; check that each failing one is a test depwave selected. Runs when tests
      # fail too (that's the interesting case) and exits 3 when depwave missed one. The JSON is the track record.
      - name: depwave shadow check
        # No results file = the test step died before vitest reported; that failure is already visible above.
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' && hashFiles('test-results.json') != '' }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}"; else BASE="HEAD~1"; fi
          SHADOW=(node packages/cli/dist/bin.js shadow --base "$BASE" --head HEAD --results test-results.json)
          "${SHADOW[@]}" --format json > depwave-shadow.json || true
          "${SHADOW[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          "${SHADOW[@]}" # the step's verdict (served from the cache the first run filled)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depwave-impact-${{ matrix.os }}
          path: |
            depwave-impact.json
            depwave-shadow.json
          if-no-files-found: ignore

  # Paths with spaces and non-ASCII characters break naive quoting, URL conversion and `-z`-less git parsing.
  # The maintainer's own checkout has a Hebrew path; this keeps CI honest about it.
  unusual-path:
    name: check (path with spaces + Hebrew)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws dir/שלום/depwave
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ws dir/שלום/depwave
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ws dir/שלום/depwave/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ws dir/שלום/depwave/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node packages/cli/dist/bin.js impact --base HEAD~1 --head HEAD
