name: depwave impact
description: Comment on a pull request with the test files its diff impacts, and why.
author: zoharyehia-sys
branding:
  icon: activity
  color: blue

inputs:
  base:
    description: Base revision to compare against. Default `origin/<the PR's base branch>`. The merge base is used.
    required: false
    default: ''
  granularity:
    description: '`symbol` (precise, default) or `file`.'
    required: false
    default: symbol
  explain:
    description: Include `depwave why` paths for the top N impacted tests (0 = none).
    required: false
    default: '3'
  comment:
    description: Post or update one sticky PR comment. The report always goes to the job summary.
    required: false
    default: 'true'
  test-results:
    description: >-
      Shadow mode: results of a FULL test run (Vitest/Jest JSON or JUnit XML; several paths separated by spaces or
      newlines). depwave checks that every failing test is one it selected, adds the verdict to the report, and fails
      the step when one was missed. Run this action after your tests, with `if: !cancelled()`.
    required: false
    default: ''
  cache:
    description: >-
      Keep depwave's analysis cache (`.depwave/`) between runs with `actions/cache`. Only files and commits not seen
      before are analyzed again.
    required: false
    default: 'true'
  github-token:
    description: 'Token used to comment. Needs `pull-requests: write`.'
    required: false
    default: ${{ github.token }}

outputs:
  impacted-tests:
    description: Number of impacted test files.
    value: ${{ steps.analyze.outputs.impacted-tests }}
  total-tests:
    description: Number of test files in the head revision.
    value: ${{ steps.analyze.outputs.total-tests }}
  run-all:
    description: '`true` when a global trigger (lockfile, root config) selected every test.'
    value: ${{ steps.analyze.outputs.run-all }}
  tests:
    description: Impacted test files, space-separated, for passing to a test runner.
    value: ${{ steps.analyze.outputs.tests }}
  report:
    description: Path to the full JSON report.
    value: ${{ steps.analyze.outputs.report }}
  shadow-verdict:
    description: 'With `test-results`: `sound`, `missed` or `inconclusive`.'
    value: ${{ steps.analyze.outputs.shadow-verdict }}
  shadow-missed:
    description: 'With `test-results`: failing test files depwave did not select, space-separated.'
    value: ${{ steps.analyze.outputs.shadow-missed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # pnpm via Node's bundled corepack, shimmed into a private directory: uses depwave's own pinned
    # `packageManager` version and never touches (or clashes with) a pnpm the calling workflow set up.
    - name: Build depwave
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        set -euo pipefail
        SHIM="$RUNNER_TEMP/depwave-pnpm"
        mkdir -p "$SHIM"
        corepack enable --install-directory "$SHIM" pnpm
        export PATH="$SHIM:$PATH"
        pnpm install --frozen-lockfile
        TURBO_TELEMETRY_DISABLED=1 pnpm build

    # Everything in the cache is keyed by file content or commit, so a restored cache is never stale. One entry per
    # commit; restore-keys picks the newest entry this run can read: its own branch's, else the base branch's.
    - name: Restore the analysis cache
      id: restore-cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.depwave
        key: depwave-${{ runner.os }}-${{ github.sha }}
        restore-keys: depwave-${{ runner.os }}-

    - name: Analyze the pull request
      id: analyze
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_GRANULARITY: ${{ inputs.granularity }}
        INPUT_EXPLAIN: ${{ inputs.explain }}
        INPUT_TEST_RESULTS: ${{ inputs.test-results }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        BIN="$GITHUB_ACTION_PATH/packages/cli/dist/bin.js"
        BASE="${INPUT_BASE:-origin/${BASE_REF:-main}}"
        if ! git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
          echo "::error::depwave: base '$BASE' not found. Check out with 'fetch-depth: 0' so the merge base is available."
          exit 1
        fi
        JSON="$RUNNER_TEMP/depwave-impact.json"
        MD="$RUNNER_TEMP/depwave-impact.md"
        node "$BIN" impact --cwd "$GITHUB_WORKSPACE" --base "$BASE" --head HEAD --granularity "$INPUT_GRANULARITY" --format json > "$JSON"
        # Second run is served from the cache the first one just filled.
        node "$BIN" impact --cwd "$GITHUB_WORKSPACE" --base "$BASE" --head HEAD --granularity "$INPUT_GRANULARITY" --format markdown --explain "$INPUT_EXPLAIN" > "$MD"
        if [ -n "$INPUT_TEST_RESULTS" ]; then
          SHADOW=(node "$BIN" shadow --cwd "$GITHUB_WORKSPACE" --base "$BASE" --head HEAD --granularity "$INPUT_GRANULARITY")
          for f in $INPUT_TEST_RESULTS; do SHADOW+=(--results "$f"); done
          SHADOW_JSON="$RUNNER_TEMP/depwave-shadow.json"
          "${SHADOW[@]}" --format json > "$SHADOW_JSON" || [ $? -eq 3 ] # 3 = missed, reported below; anything else is an error
          "${SHADOW[@]}" --format markdown >> "$MD" || true
          node -e '
            const { shadow } = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(`shadow-verdict=${shadow.verdict}`);
            console.log(`shadow-missed=${shadow.missed.join(" ")}`);
          ' "$SHADOW_JSON" >> "$GITHUB_OUTPUT"
        fi
        cat "$MD" >> "$GITHUB_STEP_SUMMARY"
        node -e '
          const { plan } = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
          const tests = plan.groups.flatMap((g) => g.tests);
          console.log(`impacted-tests=${tests.length}`);
          console.log(`total-tests=${plan.totalTests ?? ""}`);
          console.log(`run-all=${plan.runAll}`);
          console.log(`tests=${tests.join(" ")}`);
        ' "$JSON" >> "$GITHUB_OUTPUT"
        echo "report=$JSON" >> "$GITHUB_OUTPUT"
        echo "markdown=$MD" >> "$GITHUB_OUTPUT"

    - name: Save the analysis cache
      if: inputs.cache == 'true' && steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.depwave
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPORT_MD: ${{ steps.analyze.outputs.markdown }}
      run: node "$GITHUB_ACTION_PATH/action/post-comment.mjs" "$REPORT_MD"

    # Last, so the comment (with the missed tests listed) is posted before the job goes red.
    - name: Fail when depwave missed a failing test
      if: steps.analyze.outputs.shadow-verdict == 'missed'
      shell: bash
      env:
        MISSED: ${{ steps.analyze.outputs.shadow-missed }}
      run: |
        echo "::error::depwave shadow: failing test files that depwave did not select: $MISSED"
        exit 3
